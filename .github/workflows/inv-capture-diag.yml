name: DIAG INV Capture — tangkap frame sesudah login (read-only)

# Probe tangkap frame TCP sesudah login (2026-11-18, Bartes): bot login
# lalu MENCATAT semua frame yang dikirim server selama N detik, tanpa
# mengirim RoomEvent apa pun — untuk menemukan di frame mana inventory
# (UserInventory, List<int>) dikirim saat login.
# TIDAK ADA pembuatan draft, update draft, publish, atau penulisan
# apa pun — hanya login + baca frame.
# Jangan echo password di log (jangan set -x, jangan echo input).
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email akun (SkyDev)"
        required: true
      password:
        description: "Password akun (SkyDev)"
        required: true
      device_id:
        description: "Device ID (kosong = default probe)"
        required: false
        default: ""
      seconds:
        description: "Durasi tangkap frame (detik)"
        required: false
        default: "15"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -q aiohttp curl-cffi urllib3
      - name: Run INV capture probe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DB_EMAIL: ${{ inputs.email }}
          DB_PASSWORD: ${{ inputs.password }}
          DB_DEVICE_ID: ${{ inputs.device_id }}
          DB_SECONDS: ${{ inputs.seconds }}
        run: |
          python -u inv_capture_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --seconds "${{ inputs.seconds }}"
